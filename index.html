<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<title>ejemplo.mp3</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #111418; color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: #1b1f24; border-radius: 20px;
    padding: 28px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 1.15rem; margin: 0 0 4px; word-break: break-word; }
  .sub { color: #9aa0a6; font-size: .85rem; margin: 0 0 22px; }
  .time { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums;
          color: #9aa0a6; font-size: .85rem; margin-top: 6px; }
  input[type=range] { width: 100%; accent-color: #8ab4f8; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 20px 0 8px; }
  button {
    background: #2a3038; color: #e8eaed; border: 0; border-radius: 50%;
    width: 56px; height: 56px; font-size: .9rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.play { width: 76px; height: 76px; background: #8ab4f8; color: #111418; font-size: 1.6rem; }
  button:active { transform: scale(.95); }
  .speed { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .speed button { width: auto; height: 32px; border-radius: 16px; padding: 0 12px; font-size: .8rem; }
  .speed button.on { background: #8ab4f8; color: #111418; }
  .status { text-align: center; font-size: .8rem; color: #9aa0a6; min-height: 1.2em; margin-top: 16px; }
  .status.err { color: #f28b82; }
  .status a { color: #8ab4f8; }
  .tip { font-size: .75rem; color: #6f767e; margin-top: 18px; line-height: 1.4; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">ejemplo.mp3</h1>
  <p class="sub">Google Drive · MP3 · 63 MB</p>

  <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Posición">
  <div class="time"><span id="cur">0:00</span><span id="dur">--:--</span></div>

  <div class="controls">
    <button id="back" aria-label="Retroceder 15 segundos">−15</button>
    <button id="play" class="play" aria-label="Reproducir">▶</button>
    <button id="fwd" aria-label="Adelantar 30 segundos">+30</button>
  </div>

  <div class="speed" id="speed">
    <button data-r="0.75">0.75×</button>
    <button data-r="1" class="on">1×</button>
    <button data-r="1.25">1.25×</button>
    <button data-r="1.5">1.5×</button>
    <button data-r="2">2×</button>
  </div>

  <div class="status" id="status"></div>
  <p class="tip">Dale play una vez y después podés bloquear la pantalla: el audio sigue y lo controlás desde la pantalla de bloqueo.</p>
</div>

<!-- Elemento <audio> nativo: es lo que permite reproducción en segundo plano / pantalla bloqueada -->
<audio id="audio" preload="metadata" playsinline></audio>

<script>
  const FILE_ID = "1JDqaMq0VdNYABqwFb58YH2maBCdqVJ10";
  const TITLE = "ejemplo.mp3";
  // URLs directas al archivo (no al visor de Drive). Si una falla, se prueba la siguiente.
  const SOURCES = [
    `https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download`,
    `https://drive.google.com/uc?export=download&id=${FILE_ID}`,
    `https://docs.google.com/uc?export=open&id=${FILE_ID}`
  ];

  const audio = document.getElementById("audio");
  const playBtn = document.getElementById("play");
  const seek = document.getElementById("seek");
  const cur = document.getElementById("cur");
  const dur = document.getElementById("dur");
  const statusEl = document.getElementById("status");
  let srcIndex = 0, seeking = false;
  const STORE_KEY = "pos_" + FILE_ID;

  function setStatus(msg, err = false) {
    statusEl.innerHTML = msg; statusEl.className = "status" + (err ? " err" : "");
  }
  function fmt(s) {
    if (!isFinite(s)) return "--:--";
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
  }
  function loadSource(i) { srcIndex = i; audio.src = SOURCES[i]; audio.load(); }

  audio.addEventListener("error", () => {
    if (srcIndex < SOURCES.length - 1) {
      const wasPlaying = !audio.paused || playBtn.dataset.want === "1";
      loadSource(srcIndex + 1);
      if (wasPlaying) audio.play().catch(() => {});
    } else {
      setStatus(`No se pudo cargar el audio. Verificá que el archivo esté compartido como
        "Cualquier persona con el enlace". <a href="https://drive.google.com/file/d/${FILE_ID}/view" target="_blank">Abrir en Drive</a>`, true);
    }
  });

  audio.addEventListener("loadedmetadata", () => {
    seek.max = Math.floor(audio.duration || 0);
    dur.textContent = fmt(audio.duration);
    // Retomar donde quedaste
    let saved = 0;
    try { saved = parseFloat(localStorage.getItem(STORE_KEY)) || 0; } catch (e) {}
    if (saved > 5 && saved < audio.duration - 5) {
      audio.currentTime = saved;
      setStatus("Retomando desde " + fmt(saved));
    }
  });
  audio.addEventListener("waiting", () => setStatus("Cargando…"));
  audio.addEventListener("playing", () => setStatus(""));
  audio.addEventListener("play", () => { playBtn.textContent = "❚❚"; playBtn.setAttribute("aria-label","Pausar"); updateMediaState(); });
  audio.addEventListener("pause", () => { playBtn.textContent = "▶"; playBtn.setAttribute("aria-label","Reproducir"); updateMediaState(); });
  audio.addEventListener("ended", () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} });

  let lastSave = 0;
  audio.addEventListener("timeupdate", () => {
    if (!seeking) seek.value = Math.floor(audio.currentTime);
    cur.textContent = fmt(audio.currentTime);
    if (Date.now() - lastSave > 5000) {
      lastSave = Date.now();
      try { localStorage.setItem(STORE_KEY, audio.currentTime); } catch (e) {}
      updatePosition();
    }
  });

  seek.addEventListener("input", () => { seeking = true; cur.textContent = fmt(+seek.value); });
  seek.addEventListener("change", () => { audio.currentTime = +seek.value; seeking = false; });

  playBtn.addEventListener("click", () => {
    if (!audio.src) loadSource(0);
    if (audio.paused) {
      playBtn.dataset.want = "1";
      setStatus("Cargando…");
      audio.play().catch(err => setStatus("No se pudo reproducir: " + err.message, true));
    } else {
      playBtn.dataset.want = "0";
      audio.pause();
    }
  });
  const skip = d => { audio.currentTime = Math.max(0, Math.min((audio.duration || 0), audio.currentTime + d)); updatePosition(); };
  document.getElementById("back").onclick = () => skip(-15);
  document.getElementById("fwd").onclick = () => skip(30);

  document.getElementById("speed").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    audio.playbackRate = +b.dataset.r;
    document.querySelectorAll("#speed button").forEach(x => x.classList.toggle("on", x === b));
    updatePosition();
  });

  // Controles en pantalla de bloqueo / notificación (Media Session API)
  function updateMediaState() {
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = audio.paused ? "paused" : "playing";
  }
  function updatePosition() {
    if ("mediaSession" in navigator && navigator.mediaSession.setPositionState && isFinite(audio.duration)) {
      try {
        navigator.mediaSession.setPositionState({
          duration: audio.duration, playbackRate: audio.playbackRate,
          position: Math.min(audio.currentTime, audio.duration)
        });
      } catch (e) {}
    }
  }
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: TITLE, artist: "Google Drive" });
    const set = (a, h) => { try { navigator.mediaSession.setActionHandler(a, h); } catch (e) {} };
    set("play", () => audio.play());
    set("pause", () => audio.pause());
    set("seekbackward", d => skip(-(d.seekOffset || 15)));
    set("seekforward", d => skip(d.seekOffset || 30));
    set("seekto", d => { audio.currentTime = d.seekTime; updatePosition(); });
    set("previoustrack", () => skip(-15));
    set("nexttrack", () => skip(30));
  }

  loadSource(0);
</script>
</body>
</html>
